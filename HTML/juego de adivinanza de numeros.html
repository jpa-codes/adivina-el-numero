<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juego De Adivinanza De Numeros</title>
</head>
<body>
    <h2>Juego De Adivinanza De Numeros</h2>
    <p>¡Bienvenido al juego de adivinanza de números! El objetivo del juego es adivinar un número secreto generado aleatoriamente por la computadora. Puedes elegir el rango de números para hacer el juego más fácil o más difícil. ¡Buena suerte!</p>
    <input type="number" id="intento" placeholder="Ingresa tu intento">
    <button onclick="adivinar()">adividar</button>
    <p id="Pista"></p>
    <p id="IntentosRealizados"></p>
    <br>
    <script src="../JAVA/juego de adivinanza de numeros.js"></script>
</body>
</html>
